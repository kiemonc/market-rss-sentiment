<ul class="article-list">
  @for (article of articles; track article.id) {
    <li
      class="article-item"
      [class.selected]="article.id === selectedId"
      (click)="select.emit(article)"
    >
      <span class="article-title">{{ article.title }}</span>
      <span class="article-meta">{{ article.source }} · {{ article.pubDate | date: 'short' }}</span>
    </li>
  } @empty {
    <li class="article-empty">No articles yet.</li>
  }
</ul>

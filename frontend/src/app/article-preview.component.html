@if (article) {
  <article class="preview">
    <h2>{{ article.title }}</h2>
    <p class="preview-meta">{{ article.source }} · {{ article.pubDate | date: 'medium' : undefined : i18n.locale() }}</p>
    <a [href]="article.link" target="_blank" rel="noopener">{{ 'preview.openOriginal' | t }}</a>
    <p class="preview-description">{{ article.description }}</p>
    <p class="preview-content">{{ article.content }}</p>
  </article>
} @else {
  <p class="preview-placeholder">{{ 'preview.placeholder' | t }}</p>
}

<div class="stats-container">
  <form class="filters" [formGroup]="filterForm">
    <mat-form-field appearance="outline" class="filter-sources">
      <mat-label>Sources</mat-label>
      <mat-select formControlName="sources" multiple>
        @for (source of allSources; track source) {
          <mat-option [value]="source">{{ source }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="filter-date">
      <mat-label>From</mat-label>
      <input matInput type="date" formControlName="from" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="filter-date">
      <mat-label>To</mat-label>
      <input matInput type="date" formControlName="to" />
    </mat-form-field>

    @if (!filterForm.value.sources?.length) {
      <span class="filter-hint">Select at least one source to update the charts.</span>
    }
  </form>

  <section class="chart-panel">
    <h2>Articles by publication date</h2>
    <div class="chart-canvas-wrap">
      <canvas #publishedCanvas></canvas>
    </div>
  </section>

  <section class="chart-panel">
    <h2>Articles by fetch date</h2>
    <div class="chart-canvas-wrap">
      <canvas #fetchedCanvas></canvas>
    </div>
  </section>

  @if (loading) {
    <div class="spinner-overlay">
      <mat-progress-spinner mode="indeterminate" diameter="48"></mat-progress-spinner>
    </div>
  }
</div>
